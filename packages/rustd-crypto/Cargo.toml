[package]
name = "rustd-crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
md-5 = { version = "0.11", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6", default-features = false }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
