[package]
name = "rustd-gotool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
num-bigint = { version = "0.4.6", default-features = false, features = ["std"] }
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint", "num-bigint-std", "std"] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true
