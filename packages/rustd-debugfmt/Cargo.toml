[package]
name = "rustd-debugfmt"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
memmap2 = "0.9"
object = { version = "0.37", default-features = false, features = ["read", "elf", "macho", "pe", "std"] }
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true
