[package]
name = "rustd-checksum"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
crc32fast = "1.5.2"
adler2 = "2.0.1"
siphasher = "1.0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
