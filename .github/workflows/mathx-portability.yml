name: Mathx portability diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mathx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RUSTD_GO: path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - run: go run ./tools/gofixtures/mathx-portability
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rustd-mathx build
      - run: pnpm --filter rustd-mathx test
