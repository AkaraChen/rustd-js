name: Native packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RUSTD_GO: path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      # Committed npm platform workspaces resolve the semver optional dependencies locally.
      # Their links are in pnpm-lock.yaml, so frozen installs do not need unpublished npm packages.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:go
      - name: rustd-unicode generate:check
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm --filter rustd-unicode generate:check
      - run: pnpm check:size
      - run: pnpm test:pack
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: packages/*/*.node
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node 20 packaged runtime compatibility
        run: node scripts/pack-smoke.mjs
