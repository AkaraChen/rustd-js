name: Go constant fixtures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - run: python3 scripts/generate-constant-fixtures.py artifacts/go-constant
      - uses: actions/upload-artifact@v4
        with:
          name: go-constant-${{ matrix.os }}
          path: artifacts/go-constant
          if-no-files-found: error
